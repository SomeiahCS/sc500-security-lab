<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
  <meta name="robots" content="noindex">
  <title>Sign in</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./auth.css">
</head>
<body data-page="login">
  <main class="auth-page">
    <section class="auth-card">
      <span class="auth-spark spark-a" aria-hidden="true">✦</span>
      <span class="auth-spark spark-b" aria-hidden="true">✦</span>
      <div class="auth-cloud cloud-one" aria-hidden="true"></div>
      <div class="auth-cloud cloud-two" aria-hidden="true"></div>
      <div class="auth-plant plant-left" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <div class="auth-plant plant-right" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

      <div class="auth-content">
        <h1>Sign in</h1>
        <form id="authForm" autocomplete="on">
          <div class="field">
            <label class="sr-only" for="email">Email address</label>
            <div class="input-shell"><span aria-hidden="true">✉</span><input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required maxlength="254"></div>
          </div>
          <div class="field">
            <label class="sr-only" for="password">Password</label>
            <div class="input-shell"><span aria-hidden="true">▣</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required minlength="12" maxlength="128"></div>
          </div>
          <button type="submit">Sign in</button>
          <div id="message" class="message" aria-live="polite"></div>
        </form>
        <p class="meta">New here? <a href="/register.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <script src="./auth-ui.js"></script>
</body>
</html>
